<html lang="en">

<meta charset="UTF-8">

<style>
/* =====================================================
   VARIABLES & RESET
===================================================== */
:root{
  --bg-deep:#060a14; --bg-dark:#0a1020; --bg-panel:#0d1528; --bg-card:#111d36;
  --purple:#7c3aed; --purple-l:#8b5cf6; --purple-br:#a78bfa;
  --pink:#ec4899; --pink-l:#f472b6;
  --green:#10b981; --green-br:#34d399;
  --cyan:#06b6d4; --cyan-br:#67e8f9;
  --orange:#f97316; --yellow:#eab308;
  --text:#e2e8f0; --text-dim:#94a3b8; --text-muted:#475569;
  --border:rgba(139,92,246,0.15); --border-g:rgba(139,92,246,0.4);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg-deep);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;min-height:100vh;}
::-webkit-scrollbar{width:5px;}
::-webkit-scrollbar-track{background:var(--bg-dark);}
::-webkit-scrollbar-thumb{background:var(--purple);border-radius:3px;}
button{cursor:pointer;font-family:inherit;}
input,textarea,select{font-family:inherit;}
.fade-in{animation:fadeIn .35s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* =====================================================
   LAYOUT
===================================================== */
.page{max-width:860px;margin:0 auto;padding:28px 18px 60px;}
.card{background:var(--bg-card);border:1px solid var(--border);border-radius:16px;padding:22px 24px;margin-bottom:16px;}
.card-hover{transition:transform .2s,border-color .2s,box-shadow .2s;}
.card-hover:hover{transform:translateY(-2px);border-color:rgba(139,92,246,.35);box-shadow:0 6px 20px rgba(0,0,0,.3);}

/* =====================================================
   TYPOGRAPHY
===================================================== */
.gradient-text{background:linear-gradient(135deg,var(--purple-br),var(--pink));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.section-eyebrow{font-size:11px;font-weight:700;letter-spacing:2px;color:var(--purple-br);text-transform:uppercase;margin-bottom:8px;}
.section-title{font-size:clamp(20px,3vw,28px);font-weight:900;margin-bottom:8px;}
.section-sub{font-size:14px;color:var(--text-dim);line-height:1.7;}
.label{font-size:10px;font-weight:700;letter-spacing:1.5px;color:var(--text-muted);text-transform:uppercase;display:block;margin-bottom:6px;}

/* =====================================================
   BUTTONS
===================================================== */
.btn{border:none;border-radius:12px;padding:13px 28px;font-size:15px;font-weight:700;cursor:pointer;transition:all .2s;}
.btn-primary{background:linear-gradient(135deg,var(--purple),#5b21b6);color:#fff;box-shadow:0 4px 18px rgba(124,58,237,.3);}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(124,58,237,.4);}
.btn-primary:disabled{opacity:.4;pointer-events:none;}
.btn-outline{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);color:var(--text-dim);}
.btn-outline:hover{border-color:var(--purple-l);color:var(--purple-br);}

/* =====================================================
   BADGES
===================================================== */
.badge{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.5px;padding:3px 10px;border-radius:99px;}
.badge-purple{background:rgba(139,92,246,.15);color:var(--purple-br);border:1px solid rgba(139,92,246,.3);}
.badge-green{background:rgba(16,185,129,.15);color:var(--green-br);border:1px solid rgba(16,185,129,.3);}
.badge-orange{background:rgba(249,115,22,.15);color:var(--orange);border:1px solid rgba(249,115,22,.3);}
.badge-red{background:rgba(239,68,68,.15);color:#f87171;border:1px solid rgba(239,68,68,.3);}
.badge-cyan{background:rgba(6,182,212,.15);color:var(--cyan-br);border:1px solid rgba(6,182,212,.3);}
.badge-yellow{background:rgba(234,179,8,.15);color:var(--yellow);border:1px solid rgba(234,179,8,.3);}

/* =====================================================
   FORMS
===================================================== */
.form-group{margin-bottom:16px;}
.form-input{width:100%;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:11px 14px;color:var(--text);font-size:14px;transition:border-color .2s;}
.form-input:focus{outline:none;border-color:var(--purple-l);}
.form-input::placeholder{color:var(--text-muted);}
textarea.form-input{min-height:80px;resize:vertical;}
select.form-input option{background:var(--bg-dark);}

/* =====================================================
   STEP BAR
===================================================== */
.step-bar{display:flex;gap:6px;justify-content:center;margin-bottom:28px;flex-wrap:wrap;}
.step-dot{display:flex;align-items:center;gap:4px;}
.step-circle{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;transition:all .3s;flex-shrink:0;}
.step-circle.done{background:var(--purple);color:#fff;}
.step-circle.active{background:linear-gradient(135deg,var(--purple),var(--pink));color:#fff;box-shadow:0 0 12px rgba(139,92,246,.5);}
.step-circle.pending{background:rgba(255,255,255,.07);color:var(--text-muted);}
.step-line{width:20px;height:2px;background:rgba(255,255,255,.08);}
.step-line.done{background:var(--purple);}

/* =====================================================
   CLAUDE PROMPT CARDS
===================================================== */
.claude-card{background:rgba(6,182,212,.05);border:1px solid rgba(6,182,212,.2);border-left:3px solid var(--cyan);border-radius:0 12px 12px 0;padding:16px 18px;margin-top:20px;}
.claude-card-title{font-size:10px;font-weight:700;letter-spacing:2px;color:var(--cyan);text-transform:uppercase;margin-bottom:10px;display:flex;align-items:center;gap:6px;}
.claude-prompt{font-family:'Courier New',Courier,monospace;font-size:12px;color:var(--cyan-br);line-height:1.8;background:rgba(0,0,0,.25);border-radius:8px;padding:12px 14px;white-space:pre-wrap;}

/* =====================================================
   PLATFORM CARDS
===================================================== */
.platform-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-bottom:16px;}
.platform-card{background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:16px;cursor:pointer;transition:all .2s;position:relative;}
.platform-card:hover{border-color:rgba(139,92,246,.4);}
.platform-card.selected{border-color:var(--purple);background:rgba(139,92,246,.08);box-shadow:0 0 16px rgba(139,92,246,.2);}
.platform-card.selected::after{content:'✓';position:absolute;top:10px;right:12px;color:var(--purple-br);font-weight:700;font-size:14px;}
.plat-icon{font-size:24px;margin-bottom:8px;}
.plat-name{font-size:14px;font-weight:700;margin-bottom:4px;}
.plat-for{font-size:11px;color:var(--text-dim);margin-bottom:8px;line-height:1.4;}
.plat-reason{font-size:11px;color:var(--text-muted);line-height:1.4;}

/* =====================================================
   PILLAR CARDS
===================================================== */
.pillar-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-bottom:16px;}
.pillar-card{background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:16px;cursor:pointer;transition:all .2s;position:relative;}
.pillar-card:hover:not(.disabled){border-color:rgba(236,72,153,.4);}
.pillar-card.selected{border-color:var(--pink);background:rgba(236,72,153,.07);box-shadow:0 0 14px rgba(236,72,153,.15);}
.pillar-card.selected::after{content:'✓';position:absolute;top:10px;right:12px;color:var(--pink);font-weight:700;font-size:14px;}
.pillar-card.disabled{opacity:.45;pointer-events:none;}
.pillar-emoji{font-size:22px;margin-bottom:8px;}
.pillar-title{font-size:13px;font-weight:700;margin-bottom:5px;}
.pillar-desc{font-size:11px;color:var(--text-dim);line-height:1.5;}
.pillar-goal{font-size:10px;color:var(--pink-l);margin-top:6px;font-weight:600;}

/* =====================================================
   ROADMAP
===================================================== */
.roadmap-weeks{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;}
.week-card{background:var(--bg-panel);border:1px solid var(--border);border-radius:12px;padding:16px;border-top:3px solid;}
.week-num{font-size:10px;font-weight:700;letter-spacing:2px;color:var(--text-muted);text-transform:uppercase;margin-bottom:4px;}
.week-title{font-size:14px;font-weight:800;margin-bottom:4px;}
.week-goal{font-size:12px;color:var(--text-dim);margin-bottom:10px;line-height:1.4;}
.week-task{display:flex;gap:6px;font-size:11px;color:var(--text-dim);margin-bottom:5px;line-height:1.4;}
.week-metric{font-size:10px;color:var(--purple-br);margin-top:8px;font-style:italic;}

/* =====================================================
   EVENT SCREEN
===================================================== */
.event-box{background:rgba(249,115,22,.06);border:1px solid rgba(249,115,22,.25);border-radius:14px;padding:20px;margin-bottom:20px;}
.event-choices{display:flex;flex-direction:column;gap:10px;margin-bottom:16px;}
.event-choice{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:14px 16px;cursor:pointer;transition:all .2s;text-align:left;}
.event-choice:hover{border-color:var(--purple-l);background:rgba(139,92,246,.08);}
.event-choice.chosen{border-color:var(--purple);background:rgba(139,92,246,.12);}
.choice-label{font-size:10px;font-weight:700;color:var(--purple-br);letter-spacing:1px;text-transform:uppercase;margin-bottom:4px;}
.choice-text{font-size:13px;color:var(--text);line-height:1.5;}
.consequence{background:rgba(16,185,129,.06);border:1px solid rgba(16,185,129,.2);border-left:3px solid var(--green);border-radius:0 10px 10px 0;padding:12px 14px;margin-top:14px;}

/* =====================================================
   GROWTH REPORT
===================================================== */
.score-row{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:20px;}
.score-card{background:var(--bg-panel);border:1px solid var(--border);border-radius:12px;padding:16px;text-align:center;}
.score-val{font-size:36px;font-weight:900;line-height:1;margin-bottom:4px;}
.score-lbl{font-size:11px;color:var(--text-dim);}
.lesson-card{background:rgba(139,92,246,.06);border:1px solid rgba(139,92,246,.15);border-radius:10px;padding:14px 16px;margin-bottom:10px;display:flex;gap:10px;}
.lesson-num{width:24px;height:24px;border-radius:99px;background:rgba(139,92,246,.2);color:var(--purple-br);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;}

/* =====================================================
   RESPONSIVE
===================================================== */
@media(max-width:600px){
  .score-row{grid-template-columns:1fr 1fr;}
  .roadmap-weeks{grid-template-columns:1fr;}
  .platform-grid,.pillar-grid{grid-template-columns:1fr;}
}
</style>
</head>

/* =====================================================
   PLATFORM FIT SCORING
===================================================== */
function getPlatformFit(platformId, brand, mode) {
  if(mode==='personal'){
    const fits={linkedin:'excellent',newsletter:'excellent',twitter:'excellent',
      youtube:'good',podcast:'good',instagram:'neutral',tiktok:'neutral',facebook:'poor',pinterest:'poor'};
    const reasons={
      linkedin:'Your professional expertise lives here — where your ideal follower comes to learn and grow.',
      newsletter:'Email is the highest-leverage channel for personal brands. Your most engaged fans will subscribe.',
      twitter:'Thought leadership and public conversations happen here. Ideal for building intellectual credibility.',
      youtube:'Long-form video builds the deepest trust and is searchable for years. High effort, high reward.',
      podcast:'Audio builds intimacy. Starting or guesting on podcasts reaches deeply engaged niche audiences.',
      instagram:'Works if you produce visually interesting content consistently. Harder to drive without images.',
      tiktok:'Growing channel for education. Best if your expertise can be taught in short, fast clips.',
      facebook:'Your audience is likely more active on other platforms for professional learning.',
      pinterest:'Not aligned with personal brand building unless your niche is lifestyle or visual creativity.'
    };
    return{fit:fits[platformId]||'neutral',reason:reasons[platformId]||''};
  }

  const ind=(brand.industry||'').toLowerCase();
  const isVisual=['fashion','food','wellness','pet','home','fitness','style','beauty'].some(k=>ind.includes(k));
  const isB2B=['saas','legal','b2b','consulting','productivity','tech'].some(k=>ind.includes(k));
  const isEdu=['education','learning','training','course','academy'].some(k=>ind.includes(k));
  const isMusic=['music','entertainment','audio'].some(k=>ind.includes(k));

  const matrix={
    instagram:{visual:'excellent',b2b:'poor',edu:'good',music:'good',other:'neutral'},
    tiktok:{visual:'excellent',b2b:'poor',edu:'excellent',music:'excellent',other:'neutral'},
    linkedin:{visual:'poor',b2b:'excellent',edu:'good',music:'poor',other:'neutral'},
    youtube:{visual:'good',b2b:'good',edu:'excellent',music:'excellent',other:'good'},
    twitter:{visual:'neutral',b2b:'excellent',edu:'good',music:'good',other:'neutral'},
    facebook:{visual:'neutral',b2b:'neutral',edu:'neutral',music:'good',other:'neutral'},
    pinterest:{visual:'excellent',b2b:'poor',edu:'poor',music:'poor',other:'poor'},
    newsletter:{visual:'neutral',b2b:'excellent',edu:'excellent',music:'good',other:'good'},
    podcast:{visual:'poor',b2b:'excellent',edu:'excellent',music:'excellent',other:'neutral'}
  };

  const catMap={visual:'visual',b2b:'b2b',edu:'edu',music:'music'};
  const cat=isVisual?'visual':isB2B?'b2b':isEdu?'edu':isMusic?'music':'other';
  const fit=(matrix[platformId]||{})[cat]||'neutral';

  const reasonMap={
    excellent:`Strong fit — your ${brand.industry} audience is highly active here.`,
    good:'Good channel for your business type. Worth testing early.',
    neutral:'Viable if you have the resources, but not your highest-priority platform.',
    poor:'Your audience and content type are unlikely to thrive here. Focus elsewhere.'
  };
  return{fit,reason:reasonMap[fit]||''};
}

/* =====================================================
   UTILITY FUNCTIONS
===================================================== */
function rc(arr){return arr[~~(Math.random()*arr.length)];}
function clamp(v,a,b){return Math.min(Math.max(v,a),b);}
function fitColor(fit){return{excellent:'badge-green',good:'badge-purple',neutral:'badge-yellow',poor:'badge-red'}[fit]||'badge-yellow';}

function calcReport(brand, mode, platforms, pillars, eventChoice, event) {
  // Platform strategy score
  const fitScores={excellent:30,good:20,neutral:8,poor:-5};
  const platScore=platforms.length?
    clamp(Math.round(platforms.reduce((s,p)=>{const f=getPlatformFit(p,brand,mode).fit;return s+fitScores[f];},0)/(platforms.length*30)*100),50,97):60;

  // Content strategy — diversity bonus
  const types=pillars.map(pid=>{
    const list=mode==='personal'?PILLARS_PERSONAL:PILLARS_BUSINESS;
    return(list.find(p=>p.id===pid)||{}).type||'trust';
  });
  const uniqueTypes=new Set(types).size;
  const contentScore=clamp(60+(uniqueTypes*10)+rc([0,5,8]),60,95);

  // Event response
  const evt=event||{choices:[]};
  const chosen=evt.choices?.[eventChoice]||{quality:'neutral'};
  const eventBonus={best:12,neutral:3,bad:-8}[chosen.quality]||0;

  // Audience understanding — always solid
  const audScore=clamp(78+rc([0,5,8,12]),78,95);

  // Growth potential
  const growthScore=clamp(Math.round((platScore+contentScore+audScore)/3)+eventBonus,45,97);

  const bestPlatform=platforms.find(p=>getPlatformFit(p,brand,mode).fit==='excellent')||platforms[0];
  const bestPillar=pillars[0];
  const poorPlatform=platforms.find(p=>getPlatformFit(p,brand,mode).fit==='poor');

  const LESSONS_BUSINESS=[
    'Audience-first marketing beats product-first marketing every time. Know your customer before picking any channel.',
    'Fewer platforms done exceptionally well beats many platforms done poorly. 80% of results come from 20% of channels.',
    'Content pillars create the consistency that builds trust. Random posting creates random results.',
    'Social proof (customer stories) converts better than any ad you\'ll ever run. Capture it obsessively.',
    'Your email list is the only audience you truly own. Every algorithm change hurts. Email never goes away.',
    'The best marketing feels like help, not an advertisement. Solve first, sell second.'
  ];
  const LESSONS_PERSONAL=[
    'Your story is your brand. Authenticity builds audiences that no advertising budget can buy.',
    'Pick a niche and serve it deeply before going broad. "Everyone" is not an audience.',
    'Consistency of voice matters more than frequency of posting. Show up with a clear perspective every single time.',
    'Vulnerability builds trust faster than credentials. Share your failures as openly as your wins.',
    'Engagement beats broadcasting. One real conversation is worth 100 views from strangers.',
    'The most followed personal brands teach one thing exceptionally well. Find your one thing.'
  ];

  const lessons=mode==='personal'?
    [rc(LESSONS_PERSONAL),LESSONS_PERSONAL.find(l=>l.includes('niche'))||LESSONS_PERSONAL[1],rc(LESSONS_PERSONAL)]:
    [rc(LESSONS_BUSINESS),LESSONS_BUSINESS.find(l=>l.includes('email'))||LESSONS_BUSINESS[4],rc(LESSONS_BUSINESS)];

  return{
    audience:audScore,platform:platScore,content:contentScore,growth:growthScore,
    bestDecision:`Selecting ${bestPlatform||'your platform'} as a primary channel — it aligns strongly with your audience and content style.`,
    biggestMistake:poorPlatform?`Including ${poorPlatform} in your platform mix — this channel is a poor fit for your brand type and will drain resources.`
      :'Risking thin content across all pillars — ensure each pillar gets proper depth and frequency.',
    lessons:lessons.filter((l,i,a)=>a.indexOf(l)===i).slice(0,3)
  };
}

function PlatformScreen({brand,mode,onComplete}){
  const [selected,setSelected]=useState([]);
  const max=3;

  function toggle(id){
    if(selected.includes(id)){setSelected(s=>s.filter(x=>x!==id));}
    else if(selected.length<max){setSelected(s=>[...s,id]);}
  }

  const brandName=mode==='personal'?(brand.yourName||'You'):brand.name||brand.businessName;
  const promptText=`I'm building the marketing strategy for ${brandName} (${brand.industry||brand.expertise||'my brand'}).

I've chosen to focus on: ${selected.join(', ')||'[platforms to be selected]'}.

For each platform, create a specific content strategy including:
- Recommended posting frequency
- Best-performing content formats for this platform
- Ideal posting times based on my audience
- Tone and style guidelines unique to this channel
- 3 content ideas that would perform well here this month`;

  return(
    <div className="page fade-in">
      <StepBar current={3}/>
      <SectionHero eyebrow="Step 3 · Platform Strategy" title="Where Does Your Audience Live?"
        what="A platform strategy is the decision about which social media channels and distribution methods to invest in. Not every platform is right for every brand."
        why="Most brands fail because they try to be everywhere and end up doing nothing well. Choosing 2-3 platforms and mastering them beats 6 platforms done poorly every single time."/>

      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}}>
        <div style={{fontSize:13,color:'var(--text-dim)'}}>Select your top <strong style={{color:'var(--text)'}}>{max} platforms</strong></div>
        <span className={`badge ${selected.length===max?'badge-green':'badge-purple'}`}>{selected.length}/{max} selected</span>
      </div>

      <div className="platform-grid">
        {PLATFORMS.map(p=>{
          const {fit,reason}=getPlatformFit(p.id,brand,mode);
          const sel=selected.includes(p.id);
          const disabled=!sel&&selected.length>=max;
          return(
            <div key={p.id} className={`platform-card card-hover ${sel?'selected':''} ${disabled?'':''}`}
              style={{opacity:disabled?.45:1,cursor:disabled?'not-allowed':'pointer'}}
              onClick={()=>!disabled&&toggle(p.id)}>
              <div className="plat-icon">{p.icon}</div>
              <div className="plat-name">{p.name}</div>
              <div className="plat-for" style={{marginBottom:6,color:'var(--text-muted)'}}>{p.users}</div>
              <span className={`badge ${fitColor(fit)}`} style={{marginBottom:8,display:'inline-block'}}>{fit.charAt(0).toUpperCase()+fit.slice(1)} Fit</span>
              <div className="plat-reason">{reason}</div>
              <div style={{marginTop:8,fontSize:10,color:'var(--text-muted)'}}>{p.format}</div>
            </div>
          );
        })}
      </div>

      <ClaudeCard title="Platform Strategy" prompt={promptText}/>
      <button className="btn btn-primary" style={{width:'100%',marginTop:16}} disabled={selected.length<2} onClick={()=>onComplete(selected)}>
        {selected.length<2?`Select at least 2 platforms (${selected.length}/2 min)`:'Build Your Content Pillars →'}
      </button>
    </div>
  );
}

function GrowthReportScreen({brand,mode,platforms,pillars,eventChoice,event,onReplay}){
  const [scores]=useState(()=>calcReport(brand,mode,platforms,pillars,eventChoice,event));
  const brandName=mode==='personal'?(brand.yourName||'You'):brand.name||brand.businessName;
  const [animated,setAnimated]=useState(false);
  useEffect(()=>{const t=setTimeout(()=>setAnimated(true),200);return()=>clearTimeout(t);},[]);

  const pillarList=mode==='personal'?PILLARS_PERSONAL:PILLARS_BUSINESS;
  const selectedPlatformNames=platforms.map(pid=>(PLATFORMS.find(p=>p.id===pid)||{}).name||pid);
  const selectedPillarNames=pillars.map(pid=>(pillarList.find(p=>p.id===pid)||{}).title||pid);

  const promptText=`You are a senior marketing strategist reviewing ${brandName}'s growth strategy.

Platforms: ${selectedPlatformNames.join(', ')}
Content Pillars: ${selectedPillarNames.join(', ')}
Mode: ${mode==='personal'?'Personal Brand':'Business Brand'}

Write a detailed 90-day marketing growth plan that includes:
1. Month 1: Build foundation and publish first content
2. Month 2: Grow through community and collaboration
3. Month 3: Optimize based on data and scale what works

Include specific KPIs, content volumes, engagement targets, and one growth experiment per month.`;

  return(
    <div className="page fade-in">
      <StepBar current={7}/>
      <div style={{textAlign:'center',marginBottom:24}}>
        <div className="section-eyebrow">Step 7 · Complete</div>
        <div className="section-title"><span className="gradient-text">Growth Report: {brandName}</span></div>
        <div style={{fontSize:14,color:'var(--text-dim)'}}>Your complete marketing strategy analysis</div>
      </div>

      <div className="score-row">
        {[['Audience Understanding',scores.audience,'#a78bfa'],['Platform Strategy',scores.platform,'#ec4899'],
          ['Content Strategy',scores.content,'#06b6d4'],['Growth Potential',scores.growth,'#10b981']].map(([l,v,c])=>(
          <div key={l} className="score-card">
            <div className="score-val" style={{color:c}}>{animated?v:'—'}</div>
            <div className="score-lbl">{l}</div>
            <div style={{height:4,borderRadius:99,background:'rgba(255,255,255,.06)',marginTop:8,overflow:'hidden'}}>
              <div style={{height:'100%',borderRadius:99,background:c,width:animated?v+'%':'0%',transition:'width 1s ease'}}/>
            </div>
          </div>
        ))}
      </div>

      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12,marginBottom:20}}>
        <div style={{background:'rgba(16,185,129,.06)',border:'1px solid rgba(16,185,129,.2)',borderRadius:12,padding:16}}>
          <div style={{fontSize:10,color:'var(--green-br)',fontWeight:700,letterSpacing:1,textTransform:'uppercase',marginBottom:8}}>✅ Best Decision</div>
          <div style={{fontSize:13,color:'var(--text-dim)',lineHeight:1.6}}>{scores.bestDecision}</div>
        </div>
        <div style={{background:'rgba(239,68,68,.06)',border:'1px solid rgba(239,68,68,.2)',borderRadius:12,padding:16}}>
          <div style={{fontSize:10,color:'#f87171',fontWeight:700,letterSpacing:1,textTransform:'uppercase',marginBottom:8}}>⚠️ Watch Out For</div>
          <div style={{fontSize:13,color:'var(--text-dim)',lineHeight:1.6}}>{scores.biggestMistake}</div>
        </div>
      </div>

      <div className="card" style={{marginBottom:20}}>
        <div style={{fontSize:11,color:'var(--purple-br)',fontWeight:700,letterSpacing:1.5,textTransform:'uppercase',marginBottom:14}}>
          📚 3 Marketing Lessons From This Strategy
        </div>
        {scores.lessons.map((l,i)=>(
          <div key={i} className="lesson-card">
            <div className="lesson-num">{i+1}</div>
            <div style={{fontSize:13,color:'var(--text-dim)',lineHeight:1.6}}>{l}</div>
          </div>
        ))}
      </div>

      <div className="card" style={{marginBottom:20}}>
        <div style={{fontSize:11,color:'var(--text-muted)',fontWeight:700,letterSpacing:1.5,textTransform:'uppercase',marginBottom:14}}>Your Strategy at a Glance</div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16}}>
          <div>
            <div style={{fontSize:10,color:'var(--cyan)',fontWeight:700,marginBottom:8}}>SELECTED PLATFORMS</div>
            {selectedPlatformNames.map(p=><div key={p} style={{fontSize:13,marginBottom:5,display:'flex',gap:6}}><span style={{color:'var(--purple-br)'}}>◇</span>{p}</div>)}
          </div>
          <div>
            <div style={{fontSize:10,color:'var(--pink-l)',fontWeight:700,marginBottom:8}}>CONTENT PILLARS</div>
            {selectedPillarNames.map(p=><div key={p} style={{fontSize:13,marginBottom:5,display:'flex',gap:6}}><span style={{color:'var(--pink)'}}>◇</span>{p}</div>)}
          </div>
        </div>
      </div>

      <ClaudeCard title="90-Day Growth Plan" prompt={promptText}/>

      <div style={{textAlign:'center',marginTop:24,display:'flex',gap:12,justifyContent:'center',flexWrap:'wrap'}}>
        <button className="btn btn-primary" onClick={onReplay}>🔄 Try Another Brand</button>
        <div style={{fontSize:12,color:'var(--text-muted)',alignSelf:'center'}}>Different mode · different strategy · different lessons</div>
      </div>
    </div>
  );
}

/* =====================================================
   MAIN APP
===================================================== */
function App(){
  const [screen,setScreen]=useState('welcome');
  const [mode,setMode]=useState(null);
  const [brand,setBrand]=useState(null);
  const [platforms,setPlatforms]=useState([]);
  const [pillars,setPillars]=useState([]);
  const [eventChoice,setEventChoice]=useState(null);
  const [eventData,setEventData]=useState(null);

  function handleMode(m){setMode(m);setScreen('setup');}

  function handleSetup(data){
    const bData=mode==='random'?data:{...data,industry:data.industry||data.expertise||'General',
      name:data.yourName||data.businessName||'Your Brand'};
    setBrand(bData);setScreen('audience');
  }

  function handlePlatforms(p){setPlatforms(p);setScreen('pillars');}
  function handlePillars(p){setPillars(p);setScreen('roadmap');}
  function handleEvent(choice,event){setEventChoice(choice);setEventData(event);setScreen('report');}

  function replay(){
    setScreen('welcome');setMode(null);setBrand(null);
    setPlatforms([]);setPillars([]);setEventChoice(null);setEventData(null);
  }

  return(
    <div style={{background:'var(--bg-deep)',minHeight:'100vh',color:'var(--text)',
      fontFamily:'-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif'}}>
      {screen==='welcome'&&<WelcomeScreen onMode={handleMode}/>}
      {screen==='setup'&&<SetupScreen mode={mode} onComplete={handleSetup}/>}
      {screen==='audience'&&<AudienceScreen brand={brand} mode={mode} onNext={()=>setScreen('platforms')}/>}
      {screen==='platforms'&&<PlatformScreen brand={brand} mode={mode} onComplete={handlePlatforms}/>}
      {screen==='pillars'&&<PillarScreen brand={brand} mode={mode} platforms={platforms} onComplete={handlePillars}/>}
      {screen==='roadmap'&&<RoadmapScreen brand={brand} mode={mode} platforms={platforms} pillars={pillars} onNext={()=>setScreen('event')}/>}
      {screen==='event'&&<EventScreen brand={brand} mode={mode} onComplete={handleEvent}/>}
      {screen==='report'&&<GrowthReportScreen brand={brand} mode={mode} platforms={platforms} pillars={pillars} eventChoice={eventChoice} event={eventData} onReplay={replay}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
