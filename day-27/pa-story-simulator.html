  /* Chat bubble entrance animation */

    transition: all 0.2s ease;

      { type: 'priya',    text: '✓ Your PA Reference Number (SC-PA-2024-78341) is permanent proof of coverage for Humira. Save it. Share it with your pharmacy. It protects every future fill.' },
      { type: 'system',   text: '⚙️ PERSPECTIVE 2: System View — How Health Systems Track PA' },
      { type: 'priya',    text: 'Health systems and insurer teams track Prior Authorization as an operational discipline. These are the key metrics they monitor:' },
      { type: 'priya',    text: '📊 Denial Rate — the percentage of PAs denied on first submission. A high denial rate at a provider\'s office signals documentation gaps. A high denial rate at an insurer signals overly restrictive criteria.' },
      { type: 'priya',    text: '📊 Appeal Rate — the percentage of denials that are formally appealed. High appeal rates indicate that initial denials are frequently inappropriate — a signal for process review.' },
      { type: 'priya',    text: '📊 Resolution Time — average days from PA submission to final decision. Industry benchmark: 5-7 business days for standard. More than 10 days signals bottlenecks.' },
      { type: 'priya',    text: '📊 Peer-to-Peer Rate — the percentage of cases escalating to a physician call. A high P2P rate suggests systematic criteria mismatch between clinical practice and insurer policy.' },
      { type: 'rahul',    text: 'I\'m amazed that a single prescription generated this much data, this many steps, and this many people. I just wanted to treat my RA.' },
      { type: 'priya',    text: 'That\'s the gap that healthcare operations tries to close — the distance between what a patient experiences and what happens behind the scenes. The goal is to make that process as fast, fair, and transparent as possible. You\'ve now seen both sides.' },
    ],
    choices: [
      { label: '"Restart as a provider\'s perspective"',
        response: 'Great idea! The same journey looks very different from the provider side. Restarting the story now.',
        isRestart: true },
      { label: '"I\'m ready — wrap up the story"',
        response: 'You\'ve completed the full Prior Authorization journey. From diagnosis to approval, you\'ve seen every stage, every stakeholder, and every decision point. You\'re now more prepared to navigate this than most patients — and most providers too.',
        isComplete: true }
    ]
  }

];

/* =====================================================
   APP STATE
===================================================== */
let currentScene   = 0;   // index into SCENES
let messageIdx     = 0;   // index into current scene's messages[]
let isDelivering   = false;
let typingEl       = null; // the temporary typing indicator element

/* =====================================================
   MAIN: DELIVER MESSAGES ONE BY ONE
===================================================== */
function startScene(sceneIdx) {
  currentScene = sceneIdx;
  messageIdx   = 0;
  isDelivering = true;

  const scene = SCENES[sceneIdx];

  // Update progress bar
  updateProgress(scene);

  // Hide choices while delivering
  hideChoices();

  // Deliver first message
  deliverNextMessage();
}

function deliverNextMessage() {
  const scene = SCENES[currentScene];

  if (messageIdx >= scene.messages.length) {
    // All messages delivered — show choices
    isDelivering = false;
    setTimeout(showChoices, 300);
    return;
  }

  const msg = scene.messages[messageIdx];
  messageIdx++;

  // Add typing indicator (for priya and doctor, not narrator/system)
  if (msg.type === 'priya' || msg.type === 'doctor' || msg.type === 'rahul') {
    showTypingIndicator(msg.type);
    setTimeout(() => {
      removeTypingIndicator();
      appendMessage(msg);
      scrollToBottom();
      // Delay before next message (based on length)
      const delay = Math.min(600 + msg.text.length * 12, 2800);
      setTimeout(deliverNextMessage, delay);
    }, 600);
  } else {
    // Narrator / system / stat — shorter delay
    appendMessage(msg);
    scrollToBottom();
    setTimeout(deliverNextMessage, 400);
  }
}

/* =====================================================
   BUBBLE CREATION — createElement + appendChild ONLY
   (No innerHTML on #chat-container ever)
===================================================== */
function appendMessage(msg) {
  const container = document.getElementById('chat-container');

  /* ── TYPING INDICATOR ── */
  if (msg.type === 'typing') {
    const wrap = document.createElement('div');
    wrap.id    = 'typing-indicator';
    wrap.className = 'flex items-end gap-2';

    const avatar = createAvatar('priya');
    wrap.appendChild(avatar);

    const bubble = document.createElement('div');
    bubble.className = 'flex gap-1 items-center bg-white border border-blue-200 rounded-2xl rounded-bl-sm px-4 py-3 shadow-sm';

    for (let i = 0; i < 3; i++) {
      const dot = document.createElement('div');
      dot.className = 'typing-dot w-2 h-2 rounded-full bg-blue-400';
      bubble.appendChild(dot);
    }

    wrap.appendChild(bubble);
    container.appendChild(wrap);
    return;
  }

  /* ── NARRATOR ── */
  if (msg.type === 'narrator') {
    const el = document.createElement('div');
    el.className = 'bubble-enter text-center py-2';

    const text = document.createElement('p');
    text.className = 'text-xs italic text-slate-500 px-6';
    text.textContent = msg.text;

    el.appendChild(text);
    container.appendChild(el);
    return;
  }

  /* ── SYSTEM BADGE ── */
  if (msg.type === 'system') {
    const el = document.createElement('div');
    el.className = 'info-badge flex justify-center py-1';

    const badge = document.createElement('span');
    badge.className = 'bg-blue-50 border border-blue-200 text-blue-700 text-xs font-semibold px-4 py-1.5 rounded-full';
    badge.textContent = msg.text;

    el.appendChild(badge);
    container.appendChild(el);
    return;
  }

  /* ── STAT BOX ── */
  if (msg.type === 'stat') {
    const el = document.createElement('div');
    el.className = 'bubble-enter';

    const box = document.createElement('div');
    box.className = 'bg-amber-50 border-l-4 border-amber-400 rounded-r-xl px-4 py-3 mx-4';

    const text = document.createElement('p');
    text.className = 'text-xs text-amber-800 font-medium leading-relaxed';
    text.textContent = msg.text;

    box.appendChild(text);
    el.appendChild(box);
    container.appendChild(el);
    return;
  }

  /* ── DOCTOR (centered italic) ── */
  if (msg.type === 'doctor') {
    const el = document.createElement('div');
    el.className = 'bubble-enter text-center px-4 py-1';

    const label = document.createElement('p');
    label.className = 'text-xs text-slate-400 mb-1';
    label.textContent = '👨‍⚕️ Dr. Patel';

    const text = document.createElement('p');
    text.className = 'text-sm italic text-slate-600 bg-slate-100 rounded-xl px-4 py-2.5 inline-block text-left max-w-md shadow-sm';
    text.textContent = '"' + msg.text + '"';

    el.appendChild(label);
    el.appendChild(text);
    container.appendChild(el);
    return;
  }

  /* ── RAHUL (left side) ── */
  if (msg.type === 'rahul') {
    const wrap = document.createElement('div');
    wrap.className = 'bubble-enter flex items-end gap-2';

    // Avatar
    const avatar = document.createElement('div');
    avatar.className = 'w-8 h-8 rounded-full bg-blue-600 flex items-center justify-center text-base flex-shrink-0 shadow';
    avatar.textContent = '👦';
    wrap.appendChild(avatar);

    // Bubble column
    const col = document.createElement('div');
    col.className = 'flex flex-col gap-0.5';

    const nameLabel = document.createElement('span');
    nameLabel.className = 'text-xs text-blue-700 font-bold ml-1';
    nameLabel.textContent = 'Rahul';
    col.appendChild(nameLabel);

    const bubble = document.createElement('div');
    bubble.className = 'bg-blue-600 text-white text-sm px-4 py-2.5 rounded-2xl rounded-bl-sm max-w-sm shadow-sm leading-relaxed';
    bubble.textContent = msg.text;
    col.appendChild(bubble);

    wrap.appendChild(col);
    container.appendChild(wrap);
    return;
  }

  /* ── PRIYA (right side) ── */
  if (msg.type === 'priya') {
    const wrap = document.createElement('div');
    wrap.className = 'bubble-enter flex items-end gap-2 justify-end';

    // Bubble column
    const col = document.createElement('div');
    col.className = 'flex flex-col gap-0.5 items-end';

    const nameLabel = document.createElement('span');
    nameLabel.className = 'text-xs text-teal-700 font-bold mr-1';
    nameLabel.textContent = 'Priya';
    col.appendChild(nameLabel);

    const bubble = document.createElement('div');
    bubble.className = 'bg-white border border-blue-200 text-slate-700 text-sm px-4 py-2.5 rounded-2xl rounded-br-sm max-w-sm shadow-sm leading-relaxed';
    bubble.textContent = msg.text;
    col.appendChild(bubble);

    wrap.appendChild(col);

    // Avatar
    const avatar = document.createElement('div');
    avatar.className = 'w-8 h-8 rounded-full bg-teal-100 border-2 border-teal-300 flex items-center justify-center text-base flex-shrink-0 shadow';
    avatar.textContent = '👧';
    wrap.appendChild(avatar);

    container.appendChild(wrap);
    return;
  }
}

/* =====================================================
   TYPING INDICATOR
===================================================== */
function showTypingIndicator(type) {
  const container = document.getElementById('chat-container');

  const wrap = document.createElement('div');
  wrap.id = 'typing-indicator';

  if (type === 'rahul') {
    wrap.className = 'flex items-end gap-2';
    const avatar = document.createElement('div');
    avatar.className = 'w-8 h-8 rounded-full bg-blue-600 flex items-center justify-center text-base flex-shrink-0';
    avatar.textContent = '👦';
    wrap.appendChild(avatar);

    const bubble = document.createElement('div');
    bubble.className = 'flex gap-1.5 items-center bg-blue-100 rounded-2xl rounded-bl-sm px-4 py-3';
    for (let i = 0; i < 3; i++) {
      const dot = document.createElement('div');
      dot.className = 'typing-dot w-2 h-2 rounded-full bg-blue-400';
      bubble.appendChild(dot);
    }
    wrap.appendChild(bubble);

  } else {
    // Priya or doctor
    wrap.className = 'flex items-end gap-2 justify-end';

    const bubble = document.createElement('div');
    bubble.className = 'flex gap-1.5 items-center bg-slate-100 border border-slate-200 rounded-2xl rounded-br-sm px-4 py-3';
    for (let i = 0; i < 3; i++) {
      const dot = document.createElement('div');
      dot.className = 'typing-dot w-2 h-2 rounded-full bg-slate-400';
      bubble.appendChild(dot);
    }
    wrap.appendChild(bubble);

    const avatar = document.createElement('div');
    avatar.className = 'w-8 h-8 rounded-full bg-teal-100 border-2 border-teal-300 flex items-center justify-center text-base flex-shrink-0';
    avatar.textContent = type === 'doctor' ? '👨‍⚕️' : '👧';
    wrap.appendChild(avatar);
  }

  typingEl = wrap;
  container.appendChild(wrap);
  scrollToBottom();
}

function removeTypingIndicator() {
  const el = document.getElementById('typing-indicator');
  if (el) el.remove();
  typingEl = null;
}

/* =====================================================
   CHOICES
===================================================== */
function showChoices() {
  const area = document.getElementById('choices-area');
  const btns = document.getElementById('choices-buttons');
  const scene = SCENES[currentScene];

  // Clear previous buttons
  while (btns.firstChild) btns.removeChild(btns.firstChild);

  scene.choices.forEach((choice, i) => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn flex-1 text-left border-2 border-blue-300 hover:border-blue-500 hover:bg-blue-50 bg-white text-sm text-blue-800 px-4 py-3 rounded-xl shadow-sm font-medium leading-snug';
    btn.textContent = choice.label;
    btn.onclick = () => handleChoice(i);
    btns.appendChild(btn);
  });

  area.classList.remove('hidden');
  scrollToBottom();
}

function hideChoices() {
  const area = document.getElementById('choices-area');
  area.classList.add('hidden');
}

function handleChoice(choiceIdx) {
  const scene    = SCENES[currentScene];
  const choice   = scene.choices[choiceIdx];

  // Disable choice buttons
  const btns = document.getElementById('choices-buttons');
  Array.from(btns.children).forEach(b => {
    b.disabled = true;
    b.classList.add('opacity-50', 'cursor-not-allowed');
    b.classList.remove('hover:border-blue-500', 'hover:bg-blue-50');
  });

  // Append Rahul's chosen text as a bubble
  appendMessage({ type: 'rahul', text: choice.label.replace(/"/g, '') });
  scrollToBottom();

  // Append Priya's response
  setTimeout(() => {
    showTypingIndicator('priya');
    setTimeout(() => {
      removeTypingIndicator();
      appendMessage({ type: 'priya', text: choice.response });
      scrollToBottom();

      // Check special flags
      if (choice.isRestart) {
        setTimeout(() => { restartStory(); }, 1500);
        return;
      }
      if (choice.isComplete) {
        setTimeout(showCompletion, 1200);
        return;
      }

      // Advance to next scene
      const nextIdx = currentScene + 1;
      if (nextIdx < SCENES.length) {
        setTimeout(() => {
          hideChoices();
          addSceneDivider(SCENES[nextIdx]);
          startScene(nextIdx);
        }, 1000);
      } else {
        setTimeout(showCompletion, 1200);
      }
    }, 800);
  }, 400);
}

/* =====================================================
   SCENE DIVIDER
===================================================== */
function addSceneDivider(scene) {
  const container = document.getElementById('chat-container');

  const el = document.createElement('div');
  el.className = 'bubble-enter flex items-center gap-3 py-3';

  const line1 = document.createElement('div');
  line1.className = 'flex-1 h-px bg-blue-100';
  el.appendChild(line1);

  const badge = document.createElement('span');
  badge.className = 'text-xs font-bold text-blue-600 bg-blue-50 border border-blue-200 px-3 py-1 rounded-full whitespace-nowrap';
  badge.textContent = 'Scene ' + scene.id + ' · ' + scene.title;
  el.appendChild(badge);

  const line2 = document.createElement('div');
  line2.className = 'flex-1 h-px bg-blue-100';
  el.appendChild(line2);

  container.appendChild(el);
}

/* =====================================================
   PROGRESS BAR
===================================================== */
function updateProgress(scene) {
  document.getElementById('progress-fill').style.width = scene.progress + '%';
  document.getElementById('scene-label').textContent = 'Scene ' + scene.id + ' of 8';
  document.getElementById('scene-name').textContent = scene.title;

  // Update dots
  for (let i = 1; i <= 8; i++) {
    const dot = document.getElementById('dot-' + i);
    if (!dot) continue;
    if (i < scene.id)      dot.className = 'prog-dot w-2 h-2 rounded-full bg-blue-500';
    else if (i === scene.id) dot.className = 'prog-dot w-2 h-2 rounded-full bg-blue-600 ring-2 ring-blue-300';
    else                   dot.className = 'prog-dot w-2 h-2 rounded-full bg-blue-200';
  }
}

/* =====================================================
   SCROLL TO BOTTOM
===================================================== */
function scrollToBottom() {
  setTimeout(() => {
    const c = document.getElementById('chat-container');
    const parent = c.parentElement;
    window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
  }, 50);
}

/* =====================================================
   COMPLETION SUMMARY CARD
===================================================== */
function showCompletion() {
  hideChoices();
  const area = document.getElementById('completion-area');
  area.classList.remove('hidden');

  // Build summary card with createElement
  const card = document.createElement('div');
  card.className = 'summary-card bg-white border-2 border-blue-200 rounded-2xl overflow-hidden shadow-lg';

  // Header
  const header = document.createElement('div');
  header.className = 'bg-gradient-to-r from-blue-700 to-blue-600 text-white px-6 py-5 text-center';
  const h2 = document.createElement('h2');
  h2.className = 'text-xl font-bold';
  h2.textContent = '🏁 PA Journey Complete!';
  const sub = document.createElement('p');
  sub.className = 'text-blue-200 text-sm mt-1';
  sub.textContent = 'Rahul\'s Prior Authorization Story — 8 Scenes';
  header.appendChild(h2);
  header.appendChild(sub);
  card.appendChild(header);

  // Body
  const body = document.createElement('div');
  body.className = 'p-6';

  // Key points
  const kpTitle = document.createElement('p');
  kpTitle.className = 'text-xs font-bold text-slate-500 uppercase tracking-widest mb-3';
  kpTitle.textContent = 'Key Takeaways';
  body.appendChild(kpTitle);

  const takeaways = [
    '✓ PA is a pre-approval process for high-cost treatments — not a barrier to care.',
    '✓ Step therapy documentation is the #1 cause of preventable denials.',
    '✓ A denial is never final — appeal, P2P review, and External Independent Review are all options.',
    '✓ Peer-to-Peer review (physician to physician) resolves 65-70% of denials.',
    '✓ An approved PA Reference Number (SC-PA-2024-78341) protects all future fills.',
    '✓ Health systems track denial rate, appeal rate, resolution time, and P2P rate as quality metrics.',
  ];
  takeaways.forEach(t => {
    const item = document.createElement('div');
    item.className = 'flex items-start gap-2 mb-2';
    const text = document.createElement('p');
    text.className = 'text-sm text-slate-700 leading-relaxed';
    text.textContent = t;
    item.appendChild(text);
    body.appendChild(item);
  });

  // AMA stat
  const stat = document.createElement('div');
  stat.className = 'bg-amber-50 border border-amber-200 rounded-xl px-4 py-3 mt-4 mb-5';
  const statText = document.createElement('p');
  statText.className = 'text-xs text-amber-800 font-medium';
  statText.textContent = '📊 AMA 2023: PA causes treatment delays in the majority of cases. Physicians spend 14.6 hours/week on PA administration.';
  stat.appendChild(statText);
  body.appendChild(stat);

  // Restart button
  const btnWrap = document.createElement('div');
  btnWrap.className = 'flex gap-3 justify-center';
  const restartBtn = document.createElement('button');
  restartBtn.className = 'bg-blue-600 hover:bg-blue-700 text-white text-sm font-bold px-6 py-2.5 rounded-xl transition-all shadow';
  restartBtn.textContent = '🔄 Start Over';
  restartBtn.onclick = restartStory;
  btnWrap.appendChild(restartBtn);
  body.appendChild(btnWrap);

  card.appendChild(body);
  area.appendChild(card);
  scrollToBottom();
}

/* =====================================================
   RESTART
===================================================== */
function restartStory() {
  currentScene   = 0;
  messageIdx     = 0;
  isDelivering   = false;

  // Clear chat container
  const container = document.getElementById('chat-container');
  while (container.firstChild) container.removeChild(container.firstChild);

  // Hide completion
  const compArea = document.getElementById('completion-area');
  compArea.classList.add('hidden');
  while (compArea.firstChild) compArea.removeChild(compArea.firstChild);

  // Reset choices
  hideChoices();
  const btns = document.getElementById('choices-buttons');
  while (btns.firstChild) btns.removeChild(btns.firstChild);

  // Reset progress
  document.getElementById('progress-fill').style.width = '12.5%';

  // Show characters legend again
  document.getElementById('characters-legend').style.display = 'flex';

  // Start scene 1
  startScene(0);
}

/* =====================================================
   HELPER: create avatar element
===================================================== */
function createAvatar(type) {
  const el = document.createElement('div');
  if (type === 'rahul') {
    el.className = 'w-8 h-8 rounded-full bg-blue-600 flex items-center justify-center text-base flex-shrink-0 shadow';
    el.textContent = '👦';
  } else {
    el.className = 'w-8 h-8 rounded-full bg-teal-100 border-2 border-teal-300 flex items-center justify-center text-base flex-shrink-0 shadow';
    el.textContent = '👧';
  }
  return el;
}

/* =====================================================
   START ON LOAD
===================================================== */
window.addEventListener('DOMContentLoaded', () => {
  startScene(0);
});
</script>
