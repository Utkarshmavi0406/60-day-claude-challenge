const MARKETS=[['Domestic only'],['North America','Europe'],['North America','Europe','Asia Pacific'],

function rc(a){return a[Math.floor(Math.random()*a.length)];}
function ri(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function clamp(v,a,b){return Math.min(Math.max(v,a),b);}

function genCompany(){
  const ind=rc(Object.keys(INDUSTRIES));
  const d=INDUSTRIES[ind];
  return{
    name:`${rc(PREFIXES)} ${rc(SUFFIXES)} ${rc(TYPES)}`,
    industry:ind,emoji:d.emoji,products:d.products,challenge:d.challenge,
    demand:rc(DEMAND),markets:MARKETS[ri(0,4)],
    revenue:`$${ri(50,8000).toLocaleString()}M`,
    employees:`${ri(200,45000).toLocaleString()}`
  };
}

const METRIC_CONFIG={
  cost:{label:'Cost Efficiency',icon:'💰',color:'#10b981',desc:'How well you control supply chain costs. Higher = better margins.'},
  speed:{label:'Delivery Speed',icon:'⚡',color:'#3b82f6',desc:'How fast products reach customers. Higher = faster delivery.'},
  risk:{label:'Risk Resilience',icon:'🛡️',color:'#8b5cf6',desc:'How well your chain handles disruptions. Higher = more resilient.'},
  satisfaction:{label:'Customer Satisfaction',icon:'⭐',color:'#f59e0b',desc:'Customer experience quality. Higher = happier customers.'},
  sustainability:{label:'Sustainability',icon:'🌱',color:'#06b6d4',desc:'Environmental impact rating. Higher = more sustainable operations.'}
};

const BASE_METRICS={cost:50,speed:50,risk:50,satisfaction:50,sustainability:50};

function applyFx(m,fx){
  const n={...m};
  Object.keys(fx).forEach(k=>{n[k]=clamp((n[k]||0)+fx[k],5,95);});
  return n;
}

function scoreGrade(s){
  if(s>=85)return{g:'S',c:'#10b981',l:'World Class'};
  if(s>=75)return{g:'A',c:'#3b82f6',l:'Excellent'};
  if(s>=65)return{g:'B',c:'#8b5cf6',l:'Good'};
  if(s>=55)return{g:'C',c:'#f59e0b',l:'Average'};
  return{g:'D',c:'#ef4444',l:'Needs Work'};
}

/* ══════════════════════════════════════════
   SHARED COMPONENTS
══════════════════════════════════════════ */

function MetricBar({mKey,value,prev,animated=true}){
  const cfg=METRIC_CONFIG[mKey];
  const [w,setW]=useState(animated?0:value);
  useEffect(()=>{const t=setTimeout(()=>setW(value),80);return()=>clearTimeout(t);},[value]);
  const delta=prev!==undefined?Math.round(value-prev):null;
  return(
    <div style={{marginBottom:12}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:6}}>
        <span style={{fontSize:12,color:'#8892a4',fontWeight:600,display:'flex',alignItems:'center',gap:5}}>
          <span>{cfg.icon}</span>{cfg.label}
        </span>
        <div style={{display:'flex',alignItems:'center',gap:8}}>
          {delta!==null&&delta!==0&&(
            <span style={{fontSize:11,fontWeight:800,color:delta>0?'#10b981':'#ef4444'}}>
              {delta>0?'+':''}{delta}
            </span>
          )}
          <span style={{fontSize:14,fontWeight:800,color:cfg.color}}>{Math.round(value)}</span>
        </div>
      </div>
      <div style={{background:'rgba(255,255,255,0.07)',borderRadius:99,height:8,overflow:'hidden'}}>
        <div className="metric-bar-fill" style={{width:w+'%',height:'100%',background:cfg.color,borderRadius:99}}/>
      </div>
    </div>
  );
}

function MetricPanel({metrics,prevMetrics,title='Live Business Metrics'}){
  return(
    <div style={{background:'rgba(255,255,255,0.03)',border:'1px solid rgba(255,255,255,0.07)',
      borderRadius:14,padding:18}}>
      <div style={{fontSize:11,color:'#8892a4',fontWeight:700,letterSpacing:1.5,
        textTransform:'uppercase',marginBottom:14}}>{title}</div>
      {Object.keys(METRIC_CONFIG).map(k=>(
        <MetricBar key={k} mKey={k} value={metrics[k]} prev={prevMetrics?.[k]}/>
      ))}
      <div style={{fontSize:10,color:'rgba(255,255,255,0.2)',marginTop:8,fontStyle:'italic'}}>
        Higher is always better for all metrics
      </div>
    </div>
  );
}

function Steps({cur,total}){
  return(
    <div style={{display:'flex',gap:6,justifyContent:'center',marginBottom:28}}>
      {Array.from({length:total}).map((_,i)=>(
        <div key={i} style={{width:i===cur?28:8,height:8,borderRadius:99,transition:'all .3s',
          background:i===cur?'#10b981':i<cur?'rgba(16,185,129,.4)':'rgba(255,255,255,.08)'}}/>
      ))}
    </div>
  );
}

function EducationBox({title,concept,whyTitle,why}){

function DecisionScreen({decision,stepIdx,totalSteps,metrics,prevMetrics,onComplete}){
  const [chosen,setChosen]=useState(null);
  const [newMetrics,setNewMetrics]=useState(metrics);
  const [showOutcome,setShowOutcome]=useState(false);

  function pick(opt){
    if(chosen)return;
    const nm=applyFx(metrics,opt.effects);
    setChosen(opt);
    setNewMetrics(nm);
    setTimeout(()=>setShowOutcome(true),200);
  }

  const outcome=chosen?decision.getOutcome(chosen):null;

  return(
    <div style={{maxWidth:960,margin:'0 auto',padding:'32px 20px'}} className="fade-in">
      <Steps cur={stepIdx} total={totalSteps}/>

      <div style={{textAlign:'center',marginBottom:20}}>
        <div style={{display:'flex',justifyContent:'center',gap:10,alignItems:'center',marginBottom:8}}>
          <Badge text={`Decision ${decision.step} of 5`} color='#10b981'/>
          <span style={{fontSize:20}}>{decision.emoji}</span>
        </div>
        <h2 style={{fontSize:'clamp(20px,3vw,28px)',fontWeight:900,marginBottom:4}}>{decision.title}</h2>
      </div>

      <div style={{display:'grid',gridTemplateColumns:'1fr',gap:0,maxWidth:800,margin:'0 auto'}}>
        <EducationBox title={decision.conceptTitle} concept={decision.concept}
          whyTitle={decision.whyTitle} why={decision.why}/>
      </div>

      <div style={{maxWidth:800,margin:'0 auto 20px'}}>
        <div style={{fontSize:12,color:'#8892a4',fontWeight:700,letterSpacing:1.5,
          textTransform:'uppercase',marginBottom:14}}>
          Choose your {decision.title.toLowerCase()}:
        </div>
        <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(200px,1fr))',gap:10}}>
          {decision.options.map(opt=>{
            const isSel=chosen?.id===opt.id;
            const isDim=chosen&&!isSel;
            return(
              <div key={opt.id} onClick={()=>pick(opt)}
                className={!chosen?'hover-card':''}
                style={{background:'rgba(255,255,255,0.03)',
                  border:`1px solid ${isSel?'rgba(16,185,129,.6)':'rgba(255,255,255,0.08)'}`,
                  borderRadius:14,padding:18,cursor:chosen?'default':'pointer',
                  opacity:isDim?.4:1,transition:'all .2s',
                  ...(isSel?{background:'rgba(16,185,129,.08)',boxShadow:'0 0 20px rgba(16,185,129,.18)'}:{})}}>
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:10}}>
                  <span style={{fontSize:24}}>{opt.icon}</span>
                  <Badge text={opt.tag} color={opt.tagColor}/>
                </div>
                <div style={{fontWeight:700,fontSize:14,marginBottom:6,color:'#f0f4ff'}}>{opt.label}</div>
                <div style={{fontSize:12,color:'#8892a4',lineHeight:1.5,marginBottom:12}}>{opt.desc}</div>
                <div style={{display:'flex',flexDirection:'column',gap:5}}>
                  <div style={{display:'flex',gap:6,fontSize:11,color:'#10b981',alignItems:'flex-start'}}>
                    <span style={{flexShrink:0}}>✓</span><span>{opt.pro}</span>
                  </div>
                  <div style={{display:'flex',gap:6,fontSize:11,color:'#8892a4',alignItems:'flex-start'}}>
                    <span style={{flexShrink:0}}>⚠</span><span>{opt.con}</span>
                  </div>
                </div>
                {/* Metric preview */}
                <div style={{display:'flex',gap:4,marginTop:10,flexWrap:'wrap'}}>
                  {Object.entries(opt.effects).filter(([,v])=>v!==0).slice(0,3).map(([k,v])=>(
                    <span key={k} style={{fontSize:9,fontWeight:700,padding:'1px 5px',borderRadius:5,
                      color:v>0?'#10b981':'#ef4444',
                      background:v>0?'rgba(16,185,129,.1)':'rgba(239,68,68,.1)'}}>
                      {v>0?'+':''}{v} {k==='satisfaction'?'CX':k==='sustainability'?'Sustain':k.charAt(0).toUpperCase()+k.slice(1)}
                    </span>
                  ))}
                </div>
              </div>
            );
          })}
        </div>
      </div>

      {/* After choice: outcome + updated metrics */}
      {showOutcome&&chosen&&(
        <div className="slide-in" style={{maxWidth:800,margin:'0 auto'}}>
          <div style={{background:'rgba(16,185,129,0.06)',border:'1px solid rgba(16,185,129,0.2)',
            borderRadius:14,padding:20,marginBottom:16}}>
            <div style={{fontSize:11,color:'#10b981',fontWeight:700,letterSpacing:1,marginBottom:10}}>
              ✅ YOU CHOSE: {chosen.label.toUpperCase()}
            </div>
            <div style={{fontSize:13,color:'#8892a4',marginBottom:12,fontWeight:600}}>
              What this means for {decision.title.toLowerCase()}:
            </div>
            <div style={{display:'flex',flexDirection:'column',gap:7}}>
              {outcome.map((p,i)=>(
                <div key={i} style={{display:'flex',gap:8,fontSize:13,color:'#c0cce0',lineHeight:1.5}}>
                  <span style={{color:'#10b981',fontWeight:700,flexShrink:0}}>→</span>
                  <span>{p}</span>
                </div>
              ))}
            </div>
          </div>

          <MetricPanel metrics={newMetrics} prevMetrics={metrics}
            title='Updated Business Metrics After This Decision'/>

          <div style={{textAlign:'center',marginTop:20}}>
            <button className="btn-press" onClick={()=>onComplete(chosen,newMetrics)}
              style={{background:'linear-gradient(135deg,#10b981,#059669)',color:'#fff',
                border:'none',borderRadius:12,padding:'14px 36px',fontSize:15,fontWeight:700,cursor:'pointer'}}>
              {stepIdx+1<totalSteps-1?'Next Decision →':'See My Results →'}
            </button>
          </div>
        </div>
      )}

      {!chosen&&(
        <div style={{maxWidth:800,margin:'0 auto'}}>
          <MetricPanel metrics={metrics} prevMetrics={prevMetrics}
            title='Current Business Metrics (Before This Decision)'/>
        </div>
      )}
    </div>
  );
}

function DashboardScreen({company,choices,finalMetrics,onReplay}){
  const overall=Math.round(Object.values(finalMetrics).reduce((a,b)=>a+b,0)/5);
  const grade=scoreGrade(overall);
  const [anim,setAnim]=useState(0);
  useEffect(()=>{const t=setTimeout(()=>setAnim(overall),250);return()=>clearTimeout(t);},[]);

  // Strengths: top metrics above 65
  const sorted=Object.entries(finalMetrics).sort(([,a],[,b])=>b-a);
  const strengths=sorted.filter(([,v])=>v>=65).slice(0,2);
  const weaknesses=sorted.filter(([,v])=>v<55).sort(([,a],[,b])=>a-b).slice(0,2);

  // Biggest risk
  const worstMetric=sorted[sorted.length-1];
  const riskMap={
    cost:'Cost overrun risk — margins are thin and may not absorb unexpected disruptions.',
    speed:'Delivery speed weakness — faster competitors may erode your customer base.',
    risk:'Supply chain fragility — one disruption event could halt operations significantly.',
    satisfaction:'Customer experience gap — poor satisfaction creates churn and reputational risk.',
    sustainability:'ESG and regulatory exposure — sustainability pressure from investors and regulators is increasing.'
  };
  const biggestRisk=riskMap[worstMetric[0]];

  // 3 improvements based on weaknesses
  const improvementsPool={
    cost:['Switch to near-shore manufacturing for your highest-volume products — you\'ll cut offshore logistics cost while maintaining reasonable labor savings.','Consolidate your transportation contracts to 1-2 carriers in exchange for volume discounts — typically saves 12-18% on freight spend.'],
    speed:['Add 1-2 regional distribution hubs near your two largest customer clusters — this alone can cut average delivery time by 40%.','For your top 20% of customers (who drive 80% of revenue), consider dedicated air freight contracts for urgent orders.'],
    risk:['Add at least one backup supplier for your most critical component immediately. Even a 20% backup allocation dramatically reduces fragility.','Implement a supplier health monitoring process — quarterly financial reviews and capacity checks prevent most surprise disruptions.'],
    satisfaction:['Invest in real-time order tracking for customers — transparency about delivery status improves satisfaction even when delays occur.','Survey your top 50 customers about their biggest supply chain pain points — the answers often point directly to where to invest first.'],
    sustainability:['Shift 30% of domestic shipments from road to rail freight — reduces transport emissions by 75% with minimal delivery time impact.','Conduct a supplier sustainability audit — often your biggest emissions are in your supply base, not your own operations.']
  };

  const improvements=[];
  const lowMetrics=['risk','cost','speed','satisfaction','sustainability'].filter(k=>finalMetrics[k]<60);
  lowMetrics.forEach(k=>{
    if(improvements.length<3&&improvementsPool[k]){
      improvements.push(improvementsPool[k][0]);
    }
  });
  const fallbacks=[
    'Implement demand forecasting software to right-size inventory — reduces both stockouts and overstock simultaneously.',
    'Negotiate long-term preferred supplier agreements in exchange for price stability and priority allocation during shortages.',
    'Conduct a quarterly supply chain risk review to identify emerging vulnerabilities before they become operational crises.'
  ];
  while(improvements.length<3)improvements.push(fallbacks[improvements.length]);

  const circ=2*Math.PI*52;

  return(
    <div style={{maxWidth:860,margin:'0 auto',padding:'32px 20px'}} className="fade-in">
      <Steps cur={6} total={7}/>

      <div style={{textAlign:'center',marginBottom:28}}>
        <h2 style={{fontSize:'clamp(22px,3.5vw,30px)',fontWeight:900,marginBottom:6}}>
          📊 Supply Chain Optimization Dashboard
        </h2>
        <div style={{color:'#8892a4',fontSize:14}}>
          {company.emoji} {company.name} · {company.industry}
        </div>
      </div>

      {/* Overall score */}
      <div style={{background:'rgba(255,255,255,0.04)',border:'1px solid rgba(255,255,255,0.08)',
        borderRadius:18,padding:'32px 24px',textAlign:'center',marginBottom:20,
        boxShadow:`0 0 30px ${grade.c}18`}}>
        <div style={{marginBottom:12,display:'flex',justifyContent:'center'}}>
          <svg width={140} height={140} style={{transform:'rotate(-90deg)'}}>
            <circle cx={70} cy={70} r={52} fill="none" stroke="rgba(255,255,255,.07)" strokeWidth={10}/>
            <circle cx={70} cy={70} r={52} fill="none" stroke={grade.c} strokeWidth={10}
              strokeDasharray={circ} strokeLinecap="round"
              className="score-ring"
              strokeDashoffset={circ*(1-anim/100)}/>
          </svg>
          <div style={{position:'absolute',display:'flex',flexDirection:'column',
            alignItems:'center',justifyContent:'center',height:140,marginTop:0}}>
            <div style={{fontSize:38,fontWeight:900,color:grade.c,fontFamily:'monospace'}}>{overall}</div>
            <div style={{fontSize:12,color:'#8892a4'}}>/ 100</div>
          </div>
        </div>
        <div style={{fontSize:22,fontWeight:900,color:grade.c,marginBottom:4}}>
          Grade {grade.g} — {grade.l}

        <div style={{fontSize:14,color:'#8892a4',maxWidth:480,margin:'0 auto',lineHeight:1.6}}>
          {overall>=80?'Outstanding optimization. Your supply chain balances cost, speed, risk, and sustainability at a high level.'
            :overall>=65?'Good performance with clear opportunities. Targeted improvements can significantly boost your overall score.'
            :'Your supply chain has meaningful gaps. Focus on the improvements below for the fastest gains.'}
        </div>
      </div>

      {/* All 5 metrics */}
      <div style={{background:'rgba(255,255,255,0.03)',border:'1px solid rgba(255,255,255,0.07)',

      <div style={{background:'rgba(255,255,255,0.03)',border:'1px solid rgba(255,255,255,0.07)',
        borderRadius:14,padding:20,marginBottom:24}}>
        <div style={{fontSize:11,color:'#8892a4',fontWeight:700,letterSpacing:1.5,
          textTransform:'uppercase',marginBottom:14}}>Your Decisions Summary</div>
        <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(160px,1fr))',gap:8}}>
          {DECISIONS.map(d=>{
            const c=choices[d.id];
            if(!c)return null;
            return(
              <div key={d.id} style={{background:'rgba(255,255,255,0.03)',border:'1px solid rgba(255,255,255,0.07)',
                borderRadius:10,padding:'12px 14px'}}>
                <div style={{fontSize:14,marginBottom:4}}>{d.emoji}</div>
                <div style={{fontSize:10,color:'#8892a4',fontWeight:700,letterSpacing:1,marginBottom:4}}>
                  {d.title.toUpperCase()}
                </div>
                <div style={{fontSize:12,fontWeight:700,color:'#e8edf8'}}>{c.label}</div>
              </div>
            );
          })}
        </div>
      </div>

      {/* Replay */}
      <div style={{textAlign:'center',display:'flex',gap:14,justifyContent:'center',flexWrap:'wrap'}}>
        <button className="btn-press" onClick={onReplay}
          style={{background:'linear-gradient(135deg,#10b981,#059669)',color:'#fff',
            border:'none',borderRadius:12,padding:'14px 36px',fontSize:15,fontWeight:700,cursor:'pointer'}}>
          🔄 Build Another Chain
        </button>
        <div style={{fontSize:12,color:'#8892a4',alignSelf:'center'}}>
          Try a different company and different decisions
        </div>
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════
   MAIN APP
══════════════════════════════════════════ */

function App(){
  const [screen,setScreen]=useState('welcome');
  const [company,setCompany]=useState(null);
  const [step,setStep]=useState(0); // which decision (0-4)
  const [choices,setChoices]=useState({});
  const [metrics,setMetrics]=useState({...BASE_METRICS});
  const [prevMetrics,setPrevMetrics]=useState(null);

  const TOTAL_STEPS=7; // welcome, company, 5 decisions, dashboard

  function startSim(){
    setCompany(genCompany());
    setStep(0);
    setChoices({});
    setMetrics({...BASE_METRICS});
    setPrevMetrics(null);
    setScreen('company');
  }

  function handleDecisionComplete(choice,newMetrics){
    const decision=DECISIONS[step];
    setPrevMetrics({...metrics});
    setMetrics(newMetrics);
    setChoices(c=>({...c,[decision.id]:choice}));

    if(step+1>=DECISIONS.length){
      setScreen('dashboard');
    } else {
      setStep(s=>s+1);
      setScreen('decision_'+DECISIONS[step+1].id);
    }
  }

  function replay(){
    setScreen('welcome');
    setStep(0);
    setChoices({});
    setMetrics({...BASE_METRICS});
    setPrevMetrics(null);
  }

  const currentDecision=DECISIONS[step];

  return(
    <div style={{background:'#070c1a',minHeight:'100vh',color:'#e8edf8',
      fontFamily:'-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif'}}>
      {screen==='welcome'&&<WelcomeScreen onStart={startSim}/>}
      {screen==='company'&&<CompanyScreen company={company} onNext={()=>setScreen('decision_'+DECISIONS[0].id)}/>}
      {screen.startsWith('decision_')&&(
        <DecisionScreen
          key={currentDecision.id}
          decision={currentDecision}
          stepIdx={step+2}
          totalSteps={TOTAL_STEPS}
          metrics={metrics}
          prevMetrics={prevMetrics}
          onComplete={handleDecisionComplete}
        />
      )}
      {screen==='dashboard'&&(
        <DashboardScreen
          company={company}
          choices={choices}
          finalMetrics={metrics}
          onReplay={replay}
        />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
