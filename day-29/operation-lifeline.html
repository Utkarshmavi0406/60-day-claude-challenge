function ri(min,max){return Math.floor(Math.random()*(max-min+1))+min;}
function rc(arr){return arr[Math.floor(Math.random()*arr.length)];}
function clamp(v,lo,hi){return Math.min(Math.max(v,lo),hi);}

function genCompany(){
  const ind=rc(Object.keys(COMPANY_DATA));
  const d=COMPANY_DATA[ind];
  return{name:rc(d.names),industry:ind,products:d.products,
    revenue:ri(250,9000),factories:ri(2,18),warehouses:ri(8,45),
    suppliers:ri(50,350),inventoryDays:ri(18,72),leadTime:ri(10,60),
    countries:ri(12,55),employees:ri(2000,48000)};
}

const BASE_METRICS={cost:72,inventory:68,profit:70,deliverySpeed:74,customerSat:76};

function applyFx(m,fx){
  const n={...m};
  Object.keys(fx).forEach(k=>{n[k]=clamp((n[k]||0)+fx[k],5,100);});
  return n;
}

function metricColor(v){
  if(v>=70)return'#10b981';
  if(v>=50)return'#f59e0b';
  return'#ef4444';
}

function scoreGrade(s){
  if(s>=90)return{g:'S+',c:'#10b981',label:'Crisis Master'};
  if(s>=80)return{g:'A',c:'#3b82f6',label:'Executive Leader'};
  if(s>=70)return{g:'B',c:'#8b5cf6',label:'Solid Manager'};
  if(s>=60)return{g:'C',c:'#f59e0b',label:'Average Response'};
  return{g:'D',c:'#ef4444',label:'Needs Improvement'};
}

function PBar({value,color,h=8}){
  const [w,setW]=useState(0);
  useEffect(()=>{const t=setTimeout(()=>setW(value),80);return()=>clearTimeout(t);},[value]);
  return(
    <div style={{background:'rgba(255,255,255,0.07)',borderRadius:99,height:h,overflow:'hidden'}}>
      <div style={{width:w+'%',height:'100%',background:color||'#3b82f6',borderRadius:99,
        transition:'width 0.8s cubic-bezier(0.4,0,0.2,1)'}}/>
    </div>
  );
}

function Badge({text,color='#3b82f6'}){
  return(
    <span style={{background:color+'25',border:`1px solid ${color}50`,color,
      borderRadius:99,padding:'2px 10px',fontSize:11,fontWeight:700,letterSpacing:.5}}>
      {text}
    </span>
  );
}

function Steps({cur,total}){
  return(
    <div style={{display:'flex',gap:6,justifyContent:'center',marginBottom:28}}>
      {Array.from({length:total}).map((_,i)=>(
        <div key={i} style={{width:i===cur?28:8,height:8,borderRadius:99,transition:'all .3s',
          background:i===cur?'#3b82f6':i<cur?'rgba(59,130,246,.4)':'rgba(255,255,255,.08)'}}/>
      ))}
    </div>
  );
}

function Card({children,style={},glow=false}){
  return(
    <div style={{background:'rgba(255,255,255,0.04)',border:'1px solid rgba(255,255,255,0.08)',
      borderRadius:16,padding:24,transition:'all .2s',
      boxShadow:glow?'0 0 30px rgba(59,130,246,0.15)':undefined,...style}}>
      {children}
    </div>
  );
}

function MetricRow({label,value,prev}){
  const diff=prev!==undefined?Math.round(value-prev):null;
  return(
    <div style={{marginBottom:12}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:5}}>
        <span style={{fontSize:12,color:'#8892a4',fontWeight:600}}>{label}</span>
        <div style={{display:'flex',alignItems:'center',gap:6}}>
          {diff!==null&&diff!==0&&(
            <span style={{fontSize:11,fontWeight:700,color:diff>0?'#10b981':'#ef4444'}}>
              {diff>0?'+':''}{diff}
            </span>
          )}
          <span style={{fontSize:13,fontWeight:700,color:metricColor(value)}}>{Math.round(value)}%</span>
        </div>
      </div>
      <PBar value={value} color={metricColor(value)}/>
    </div>
  );
}

function WarRoomScreen({crisis,onComplete}){
  const initialM=applyFx(BASE_METRICS,crisis.metrics);
  const [selected,setSelected]=useState([]);
  const [metrics,setMetrics]=useState(initialM);
  const [confirmed,setConfirmed]=useState(false);

  function toggle(action){
    if(confirmed)return;
    if(selected.find(s=>s.id===action.id)){
      const newSel=selected.filter(s=>s.id!==action.id);
      let m=initialM;
      newSel.forEach(a=>{m=applyFx(m,a.effects);});
      setSelected(newSel);
      setMetrics(m);
    } else if(selected.length<3){
      const newSel=[...selected,action];
      let m=initialM;
      newSel.forEach(a=>{m=applyFx(m,a.effects);});
      setSelected(newSel);
      setMetrics(m);
    }
  }

  return(
    <div style={{maxWidth:960,margin:'0 auto',padding:'32px 20px'}} className="fade-in">
      <Steps cur={2} total={7}/>
      <div style={{textAlign:'center',marginBottom:8}}>
        <Badge text={crisis.type} color={crisis.urgencyColor}/>
      </div>

        marginBottom:6,marginTop:8}}>⚔️ War Room: Crisis Response</h2>
      <p style={{textAlign:'center',color:'#8892a4',fontSize:14,marginBottom:28,maxWidth:580,margin:'0 auto 28px'}}>
        Choose <strong style={{color:'#f0f4ff'}}>3 response actions</strong>. Each affects your business metrics differently.
        Think carefully — you can't change your choices after executing.
      </p>

      <div style={{display:'grid',gridTemplateColumns:'1fr',gap:12,marginBottom:24}}>
        <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(280px,1fr))',gap:12}}>
          {WAR_ACTIONS.map((a,i)=>{
            const isSel=!!selected.find(s=>s.id===a.id);
            const isDisabled=!isSel&&selected.length===3;
            return(
              <div key={a.id} onClick={()=>toggle(a)}
                className={!isDisabled?'hover-lift':''}
                style={{background:isSel?'rgba(59,130,246,0.12)':'rgba(255,255,255,0.03)',
                  border:`1px solid ${isSel?'rgba(59,130,246,0.5)':'rgba(255,255,255,0.08)'}`,
                  borderRadius:14,padding:18,cursor:isDisabled?'default':'pointer',
                  opacity:isDisabled?0.4:1,transition:'all .2s',
                  boxShadow:isSel?'0 0 20px rgba(59,130,246,0.2)':undefined}}>
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:10}}>
                  <span style={{fontSize:24}}>{a.emoji}</span>
                  {isSel&&<span style={{background:'#3b82f6',color:'#fff',borderRadius:99,
                    fontSize:11,fontWeight:700,padding:'2px 10px'}}>
                    #{selected.findIndex(s=>s.id===a.id)+1}
                  </span>}
                </div>
                <div style={{fontWeight:700,fontSize:14,marginBottom:6,color:'#f0f4ff'}}>{a.title}</div>
                <div style={{fontSize:12,color:'#8892a4',lineHeight:1.5,marginBottom:10}}>{a.desc}</div>
                <div style={{fontSize:11,color:'#60a5fa',fontStyle:'italic',lineHeight:1.4}}>{a.why}</div>
                <div style={{display:'flex',gap:6,marginTop:10,flexWrap:'wrap'}}>
                  {Object.entries(a.effects).filter(([,v])=>v!==0).slice(0,3).map(([k,v])=>(
                    <span key={k} style={{fontSize:10,fontWeight:700,
                      color:v>0?'#10b981':'#ef4444',
                      background:v>0?'rgba(16,185,129,0.1)':'rgba(239,68,68,0.1)',
                      borderRadius:6,padding:'2px 6px'}}>
                      {v>0?'+':''}{v} {k.replace('customerSat','CX').replace('deliverySpeed','Speed').replace('profit','Profit')}

        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'8px 24px'}}>

function NegotiationScreen({onComplete}){
  const [rIdx,setRIdx]=useState(0);
  const [stats,setStats]=useState({trust:50,price:50,lead:50});
  const [scores,setScores]=useState([]);
  const [choices,setChoices]=useState([]);
  const [chosen,setChosen]=useState(null);
  const [showing,setShowing]=useState(false);

  function choose(opt){
    if(chosen!==null)return;
    setChosen(opt);
    setShowing(true);
    setStats(s=>({
      trust:clamp(s.trust+opt.trust,0,100),
      price:clamp(s.price+opt.price,0,100),
      lead:clamp(s.lead+opt.lead,0,100)
    }));
    setScores(s=>[...s,opt.score]);
    setChoices(c=>[...c,{round:rIdx,choice:opt.text}]);
  }

  function next(){
    if(rIdx+1>=NEG_ROUNDS.length){
      const avg=Math.round([...scores,chosen?.score||50].reduce((a,b)=>a+b,0)/NEG_ROUNDS.length);
      onComplete(avg,choices);
    } else {
      setRIdx(i=>i+1);
      setChosen(null);
      setShowing(false);
    }
  }

  const round=NEG_ROUNDS[rIdx];

  return(
    <div style={{maxWidth:820,margin:'0 auto',padding:'32px 20px'}} className="fade-in">
      <Steps cur={3} total={7}/>
      <div style={{textAlign:'center',marginBottom:24}}>
        <Badge text={`Round ${rIdx+1} of 4`} color='#8b5cf6'/>
        <h2 style={{fontSize:'clamp(20px,3vw,26px)',fontWeight:900,marginTop:10,marginBottom:6}}>
          🤝 Supplier Negotiation
        </h2>
        <div style={{color:'#8892a4',fontSize:13}}>{round.title}</div>
      </div>

      {/* Live negotiation stats */}
      <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:10,marginBottom:20}}>
        {[['Supplier Trust',stats.trust,'#10b981'],['Price Position',stats.price,'#f59e0b'],
          ['Lead Time',stats.lead,'#3b82f6']].map(([l,v,c])=>(
          <Card key={l} style={{textAlign:'center',padding:16}}>
            <div style={{fontSize:22,fontWeight:900,color:c,marginBottom:4}}>{Math.round(v)}</div>
            <div style={{fontSize:10,color:'#8892a4',fontWeight:700,letterSpacing:1}}>{l.toUpperCase()}</div>
            <PBar value={v} color={c} h={4}/>
          </Card>
        ))}
      </div>

      <Card style={{marginBottom:16}}>
        <div style={{fontSize:13,color:'#60a5fa',fontWeight:700,marginBottom:10,letterSpacing:.5}}>
          SITUATION — ROUND {rIdx+1}
        </div>
        <p style={{fontSize:15,color:'#f0f4ff',lineHeight:1.7,marginBottom:12}}>{round.ctx}</p>
        <div style={{background:'rgba(59,130,246,0.07)',borderLeft:'3px solid #3b82f6',
          borderRadius:'0 8px 8px 0',padding:'8px 14px'}}>
          <div style={{fontSize:11,color:'#60a5fa',fontWeight:700,marginBottom:3}}>WHY THIS MATTERS</div>
          <div style={{fontSize:12,color:'#8892a4',lineHeight:1.5}}>{round.why}</div>
        </div>
      </Card>

      {/* Options */}
      <div style={{display:'flex',flexDirection:'column',gap:10,marginBottom:20}}>
        {round.opts.map((o,i)=>{
          const isChosen=chosen===o;
          const isDimmed=chosen&&!isChosen;
          return(
            <div key={i} onClick={()=>choose(o)}
              className={!chosen?'hover-lift':''}
              style={{background:isChosen?'rgba(139,92,246,0.1)':'rgba(255,255,255,0.03)',
                border:`1px solid ${isChosen?'rgba(139,92,246,0.5)':'rgba(255,255,255,0.08)'}`,
                borderRadius:12,padding:'16px 20px',cursor:chosen?'default':'pointer',
                opacity:isDimmed?0.4:1,transition:'all .2s'}}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:12}}>
                <div style={{flex:1}}>
                  <div style={{fontSize:14,color:'#f0f4ff',marginBottom:6,fontWeight:500}}>{o.text}</div>
                  {isChosen&&<div style={{fontSize:13,color:'#a78bfa',fontStyle:'italic'}}>{o.result}</div>}
                </div>
                {isChosen&&<div style={{flexShrink:0,textAlign:'right'}}>
                  <div style={{fontSize:18,fontWeight:900,color:o.score>=80?'#10b981':o.score>=60?'#f59e0b':'#ef4444'}}>
                    {o.score}

                  <div style={{fontSize:9,color:'#8892a4'}}>ROUND SCORE</div>
                </div>}
              </div>
            </div>
          );
        })}
      </div>

      {showing&&(
        <div style={{textAlign:'center'}}>
          <button className="btn-press" onClick={next}
            style={{background:'linear-gradient(135deg,#8b5cf6,#6d28d9)',color:'#fff',
              border:'none',borderRadius:12,padding:'13px 32px',fontSize:14,fontWeight:700,cursor:'pointer'}}>
            {rIdx+1<NEG_ROUNDS.length?'Next Round →':'Complete Negotiation →'}
          </button>
        </div>
      )}
    </div>
  );

                borderRadius:14,padding:20,cursor:isMax?'default':'pointer',
                opacity:isMax?0.4:1,transition:'all .2s',
                boxShadow:isSel?'0 0 20px rgba(6,182,212,0.15)':undefined}}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:12}}>
                <span style={{fontSize:26}}>{opt.emoji}</span>
                <Badge text={opt.tag} color={opt.tagColor}/>
              </div>
              <div style={{fontWeight:700,fontSize:14,marginBottom:6,color:'#f0f4ff'}}>{opt.name}</div>
              <div style={{fontSize:12,color:'#8892a4',lineHeight:1.5,marginBottom:12}}>{opt.desc}</div>
              <div style={{marginBottom:12}}>
                {opt.impacts.map((imp,i)=>(
                  <div key={i} style={{display:'flex',gap:6,marginBottom:5,fontSize:12,color:'#c0cce0'}}>
                    <span style={{color:'#10b981',flexShrink:0}}>→</span>{imp}
                  </div>
                ))}
              </div>
              <div style={{display:'flex',justifyContent:'space-between',
                borderTop:'1px solid rgba(255,255,255,0.06)',paddingTop:12}}>
                <div><div style={{fontSize:18,fontWeight:900,color:'#10b981'}}>{opt.roi}</div>
                  <div style={{fontSize:10,color:'#8892a4'}}>ESTIMATED ROI</div></div>
                <div style={{textAlign:'right'}}><div style={{fontSize:14,fontWeight:700,color:'#60a5fa'}}>{opt.years}</div>
                  <div style={{fontSize:10,color:'#8892a4'}}>PAYBACK</div></div>
              </div>
              {isSel&&<div style={{marginTop:10,textAlign:'center',fontSize:11,fontWeight:700,color:'#06b6d4'}}>
                ✓ SELECTED
              </div>}
            </div>
          );
        })}
      </div>

      {selected.length===2&&(
        <Card style={{marginBottom:24,background:'rgba(6,182,212,0.06)',border:'1px solid rgba(6,182,212,0.2)'}}>
          <div style={{fontSize:13,fontWeight:700,color:'#06b6d4',marginBottom:16}}>
            COMBINED AI IMPACT ON YOUR METRICS
          </div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'6px 24px'}}>
            {[['Cost Efficiency','cost'],['Inventory Health','inventory'],
              ['Profitability','profit'],['Delivery Speed','deliverySpeed'],
              ['Customer Satisfaction','customerSat']].map(([l,k])=>(
              <MetricRow key={k} label={l} value={aiMetrics[k]||metrics[k]} prev={metrics[k]}/>
            ))}
          </div>
        </Card>
      )}

      <div style={{textAlign:'center'}}>
        <button className="btn-press" disabled={selected.length<2}
          onClick={()=>onComplete(selected,aiMetrics)}
          style={{background:selected.length===2?'linear-gradient(135deg,#06b6d4,#0891b2)':'rgba(255,255,255,0.08)',
            color:'#fff',border:'none',borderRadius:12,padding:'14px 36px',
            fontSize:15,fontWeight:700,cursor:selected.length===2?'pointer':'default',
            opacity:selected.length<2?0.5:1}}>
          {selected.length===2?'View Final Dashboard →':'Select '+(2-selected.length)+' more investment'+(2-selected.length!==1?'s':'')}
        </button>
      </div>
    </div>
  );
}

/* ════════════════════════════════════════════════════
   SCREEN 7 — FINAL DASHBOARD
════════════════════════════════════════════════════ */

function DashboardScreen({company,crisis,warActions,negScore,ceoScore,aiInvestments,finalMetrics,onReplay}){

  // Score calculation
  const leadership=Math.round(clamp((ceoScore/500)*100,0,100));
  const negotiation=Math.round(clamp(negScore,0,100));
  const resilience=Math.round(clamp(finalMetrics.deliverySpeed*0.5+finalMetrics.inventory*0.5,0,100));
  const costControl=Math.round(clamp(finalMetrics.cost,0,100));
  const riskMgmt=Math.round(clamp(30+aiInvestments.length*30+negotiation*0.1,0,100));
  const custSat=Math.round(clamp(finalMetrics.customerSat,0,100));

  const overall=Math.round(
    leadership*0.25+negotiation*0.20+resilience*0.20+
    costControl*0.15+riskMgmt*0.10+custSat*0.10
  );

  const grade=scoreGrade(overall);

  // Best decision
  const bestAction=warActions.reduce((best,a)=>{
    const sum=Object.values(a.effects).reduce((s,v)=>s+(v>0?v:0),0);
    const bsum=Object.values(best.effects).reduce((s,v)=>s+(v>0?v:0),0);
    return sum>bsum?a:best;
  },warActions[0]);

  // Biggest mistake
  let mistake='No significant mistakes identified.';
  if(leadership<60) mistake='CEO leadership decisions — choosing suboptimal crisis responses lowers stakeholder confidence significantly.';
  else if(negotiation<55) mistake='Supplier negotiation — adversarial approaches and missed opportunities to build partnerships cost you supply chain resilience.';
  else if(costControl<50) mistake='Cost management — actions taken significantly eroded profit margins without sufficient operational benefit.';

  const recommendation=crisis.type==='Factory Fire'||crisis.type==='Supplier Bankruptcy'
    ?'For production disruptions: build a pre-qualified backup supplier network. Dual-source your top 20 critical components. Target 15-day emergency qualification SLAs.'
    :crisis.type==='Port Strike'||crisis.type==='Ocean Shipping Delay'
    ?'For logistics disruptions: develop multi-modal transport contracts with both ocean and air carriers. Maintain rolling air freight capacity agreements for emergency activation.'
    :'For this crisis type: invest in real-time supply chain visibility. Your biggest vulnerability was the time it took to understand the full impact — faster data means faster decisions.';

  const [animate,setAnimate]=useState(0);
  useEffect(()=>{const t=setTimeout(()=>setAnimate(overall),200);return()=>clearTimeout(t);},[]);

  const circumference=2*Math.PI*52;

  return(
    <div style={{maxWidth:860,margin:'0 auto',padding:'32px 20px'}} className="fade-in">
      <Steps cur={6} total={7}/>
      <div style={{textAlign:'center',marginBottom:28}}>
        <h2 style={{fontSize:'clamp(22px,3.5vw,32px)',fontWeight:900,marginBottom:6}}>
          📊 Executive Crisis Dashboard
        </h2>
        <div style={{color:'#8892a4',fontSize:14}}>{company.name} · {crisis.type}</div>
      </div>

      {/* Main score */}
      <Card style={{textAlign:'center',marginBottom:24,padding:'32px 24px'}} glow>
        <div style={{marginBottom:16}}>
          <svg width={140} height={140} style={{transform:'rotate(-90deg)'}}>
            <circle cx={70} cy={70} r={52} fill="none" stroke="rgba(255,255,255,0.07)" strokeWidth={10}/>
            <circle cx={70} cy={70} r={52} fill="none" stroke={grade.c} strokeWidth={10}
              strokeDasharray={circumference}
              strokeDashoffset={circumference*(1-animate/100)}
              strokeLinecap="round"
              style={{transition:'stroke-dashoffset 1.2s cubic-bezier(0.4,0,0.2,1)'}}/>
          </svg>
          <div style={{marginTop:-104,paddingBottom:0}}>
            <div style={{fontSize:40,fontWeight:900,color:grade.c}}>{overall}</div>
            <div style={{fontSize:13,color:'#8892a4',fontWeight:600}}>/100</div>
          </div>
        </div>
        <div style={{fontSize:24,fontWeight:900,color:grade.c,marginBottom:4}}>{grade.g}</div>
        <div style={{fontSize:17,fontWeight:700,color:'#f0f4ff',marginBottom:8}}>{grade.label}</div>
        <div style={{fontSize:13,color:'#8892a4',maxWidth:480,margin:'0 auto',lineHeight:1.5}}>
          {overall>=80?'Outstanding crisis response. You protected the business while strengthening key relationships.'
            :overall>=65?'Solid performance. A few strategic gaps prevented a perfect response, but the business survived intact.'
            :'Significant room for improvement. Several key decisions created unnecessary risk and cost.'}
        </div>
      </Card>

      {/* 6 sub-scores */}
      <Card style={{marginBottom:20}}>
        <div style={{fontSize:12,color:'#8892a4',fontWeight:700,letterSpacing:1,
          textTransform:'uppercase',marginBottom:18}}>Performance Breakdown</div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'10px 32px'}}>
          {[['Leadership',leadership,'#f59e0b'],['Negotiation',negotiation,'#8b5cf6'],
            ['Resilience',resilience,'#10b981'],['Cost Control',costControl,'#ef4444'],
            ['Risk Management',riskMgmt,'#06b6d4'],['Customer Satisfaction',custSat,'#3b82f6']
          ].map(([l,v,c])=>(
            <div key={l} style={{marginBottom:4}}>
              <div style={{display:'flex',justifyContent:'space-between',marginBottom:5}}>
                <span style={{fontSize:12,color:'#8892a4',fontWeight:600}}>{l}</span>
                <span style={{fontSize:13,fontWeight:700,color:c}}>{v}</span>
              </div>
              <PBar value={v} color={c}/>
            </div>
          ))}
        </div>
      </Card>

      {/* Feedback cards */}
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(250px,1fr))',gap:14,marginBottom:20}}>
        <Card>
          <div style={{fontSize:11,color:'#10b981',fontWeight:700,letterSpacing:1,marginBottom:8}}>
            ✓ BEST DECISION
          </div>
          <div style={{fontWeight:700,fontSize:14,marginBottom:6,color:'#f0f4ff'}}>
            {bestAction.title}
          </div>
          <div style={{fontSize:12,color:'#8892a4',lineHeight:1.5}}>{bestAction.why}</div>
        </Card>
        <Card>
          <div style={{fontSize:11,color:'#ef4444',fontWeight:700,letterSpacing:1,marginBottom:8}}>
            ⚡ BIGGEST LEARNING
          </div>
          <div style={{fontSize:13,color:'#c0cce0',lineHeight:1.5}}>{mistake}</div>
        </Card>
      </div>

      <Card style={{marginBottom:20,background:'rgba(59,130,246,0.04)',border:'1px solid rgba(59,130,246,0.15)'}}>
        <div style={{fontSize:11,color:'#3b82f6',fontWeight:700,letterSpacing:1,marginBottom:8}}>
          🎯 EXPERT RECOMMENDATION
        </div>
        <div style={{fontSize:13,color:'#c0cce0',lineHeight:1.6}}>{recommendation}</div>
      </Card>

      {/* AI investments summary */}
      <Card style={{marginBottom:20}}>
        <div style={{fontSize:12,color:'#06b6d4',fontWeight:700,letterSpacing:1,
          textTransform:'uppercase',marginBottom:14}}>AI Investments Selected</div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
          {aiInvestments.map(a=>(
            <div key={a.id} style={{background:'rgba(6,182,212,0.06)',border:'1px solid rgba(6,182,212,0.15)',
              borderRadius:10,padding:'12px 14px'}}>
              <div style={{fontWeight:700,fontSize:13,marginBottom:3}}>{a.emoji} {a.name}</div>
              <div style={{fontSize:11,color:'#10b981',fontWeight:700}}>Estimated ROI: {a.roi} over {a.years}</div>
            </div>
          ))}
        </div>
      </Card>

      {/* Lessons */}
      <Card style={{marginBottom:28}}>
        <div style={{fontSize:11,color:'#8892a4',fontWeight:700,letterSpacing:1,
          textTransform:'uppercase',marginBottom:14}}>📚 Key Lessons from this Playthrough</div>
        {[
          'Supply chain resilience requires investment before a crisis, not during.',
          'Transparent communication with customers during disruption saves relationships worth more than the crisis cost.',
          'The fastest ROI in any crisis is safety stock you already deployed — not new spending.',
          'Supplier negotiations work best when framed as long-term partnerships, not short-term transactions.',
          'AI investments pay for themselves in the next crisis you never experience.'
        ].map((l,i)=>(
          <div key={i} style={{display:'flex',gap:10,marginBottom:10,alignItems:'flex-start'}}>
            <span style={{color:'#3b82f6',fontWeight:700,flexShrink:0}}>{i+1}.</span>
            <span style={{fontSize:13,color:'#c0cce0',lineHeight:1.5}}>{l}</span>
          </div>
        ))}
      </Card>

      <div style={{textAlign:'center',display:'flex',gap:14,justifyContent:'center',flexWrap:'wrap'}}>
        <button className="btn-press" onClick={onReplay}
          style={{background:'linear-gradient(135deg,#3b82f6,#6366f1)',color:'#fff',
            border:'none',borderRadius:12,padding:'14px 36px',fontSize:15,fontWeight:700,cursor:'pointer'}}>
          🔄 Play Again
        </button>
        <div style={{fontSize:13,color:'#8892a4',alignSelf:'center'}}>
          New company · new crisis · new outcomes
        </div>
      </div>
    </div>
  );
}

/* ════════════════════════════════════════════════════
   MAIN APP
════════════════════════════════════════════════════ */

function App(){
  const [screen,setScreen]=useState('welcome');
  const [company,setCompany]=useState(null);
  const [crisis,setCrisis]=useState(null);
  const [warActions,setWarActions]=useState([]);
  const [warMetrics,setWarMetrics]=useState(BASE_METRICS);
  const [negScore,setNegScore]=useState(0);
  const [ceoScore,setCeoScore]=useState(0);
  const [aiInvestments,setAiInvestments]=useState([]);
  const [finalMetrics,setFinalMetrics]=useState(BASE_METRICS);

  function startSim(){
    const c=genCompany();
    const cr=rc(CRISES);
    setCompany(c);
    setCrisis(cr);
    setWarActions([]);
    setWarMetrics(applyFx(BASE_METRICS,cr.metrics));
    setNegScore(0);
    setCeoScore(0);
    setAiInvestments([]);
    setFinalMetrics(BASE_METRICS);
    setScreen('company');
  }

  function replay(){
    setScreen('welcome');
  }

  const containerStyle={
    background:'#070c1a',
    minHeight:'100vh',
    color:'#e8edf8',
    fontFamily:'-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif'
  };

  return(
    <div style={containerStyle}>
      {screen==='welcome'&&<WelcomeScreen onStart={startSim}/>}
      {screen==='company'&&<CompanyCrisisScreen
        company={company} crisis={crisis} metrics={warMetrics}
        onNext={()=>setScreen('warroom')}/>}
      {screen==='warroom'&&<WarRoomScreen
        crisis={crisis}
        onComplete={(actions,metrics)=>{
          setWarActions(actions);
          setWarMetrics(metrics);
          setFinalMetrics(metrics);
          setScreen('negotiation');
        }}/>}
      {screen==='negotiation'&&<NegotiationScreen
        onComplete={(score,choices)=>{
          setNegScore(score);
          setScreen('ceo');
        }}/>}
      {screen==='ceo'&&<CEOScreen
        crisis={crisis}
        onComplete={(score,answers)=>{
          setCeoScore(score);
          setScreen('ai');
        }}/>}
      {screen==='ai'&&<AIStrategyScreen
        metrics={finalMetrics}
        onComplete={(selected,metrics)=>{
          setAiInvestments(selected);
          setFinalMetrics(metrics);
          setScreen('dashboard');
        }}/>}
      {screen==='dashboard'&&<DashboardScreen
        company={company} crisis={crisis}
        warActions={warActions} negScore={negScore}
        ceoScore={ceoScore} aiInvestments={aiInvestments}
        finalMetrics={finalMetrics}
        onReplay={replay}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
